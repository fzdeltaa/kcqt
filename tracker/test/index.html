<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.33.2/cytoscape.min.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        #cy {
            width: 100%;
            height: 100dvh;
        }
    </style>
</head>
<body>

<div id="cy"></div>

<script>
const cy = cytoscape({
    container: document.getElementById("cy"),

    elements: [
        { data: { id: "WF01" } },
        { data: { id: "WC01" } },
        { data: { id: "WA01" } },

        { data: { source: "WF01", target: "WC01" } },
        { data: { source: "WC01", target: "WA01" } },
    ],

    style: [
        {
            selector: "node",
            style: {
                label: "data(id)",
                "background-color": "#7fd38b",
                "text-valign": "center",
                "text-halign": "center"
            }
        },
        {
            selector: "edge",
            style: {
                width: 2,
                "curve-style": "bezier",
                "target-arrow-shape": "triangle"
            }
        }
    ],

    layout: {
        name: "breadthfirst",
        directed: true
    }
});
</script>

</body>
</html>
