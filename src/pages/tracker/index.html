<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCQT - Kancolle Quest Tracker</title>
    <link rel="stylesheet" href="tracker.css">
</head>

<body>
    <header></header>
    <main>
        <div class="navbar">
            Import Quests: <input type="file" id="save-file-input" accept=".kc3">
        </div>
        <div id="search-bar">
            <input type="text" id="quest-search-input" placeholder="Enter quest code (e.g. A3)" />
            <button id="quest-search-btn">Search</button>
            <button id="quest-search-clear">Show All</button>
        </div>
        <div id="cy" style="height: 80dvh;"></div>
        <div id="quest-info"></div>
    </main>
    <aside></aside>

    <script type="module" src="tracker.js"></script>
</body>

</html>
